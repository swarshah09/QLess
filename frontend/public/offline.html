<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QLess — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: #ffffff;
        color: #111827;
        text-align: center;
        padding: 24px;

      .wrap { max-width: 320px; }

        display: grid; place-items: center;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #4b5563; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>
      </div>
      <h1>You're offline</h1>
      <p>QLess needs a connection for live CNG status. Reconnect to see the latest queues and pressure.</p>
    </div>
  </body>
